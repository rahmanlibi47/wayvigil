[project]
name = "saferoute-ai-backend"
version = "0.1.0"
description = "SafeRoute AI backend API"
authors = [{ name = "SafeRoute AI Contributors" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "asyncpg==0.29.0",
    "geoalchemy2==0.14.2",
    "shapely==2.0.2",
    "numpy<2",
    "pyjwt==2.8.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "firebase-admin==6.2.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.2",
    "aiohttp==3.9.1",
    "email-validator==2.1.0",
    "phonenumbers==8.13.26",
    "pillow==10.1.0",
    "imagehash==4.3.1",
    "structlog==23.2.0",
    "prometheus-client==0.19.0",
    "boto3==1.34.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
pytest-cov = "4.1.0"
factory-boy = "3.3.0"
faker = "20.1.0"
black = "23.11.0"
isort = "5.12.0"
mypy = "1.7.1"
flake8 = "6.1.0"
pytest-xdist = "3.5.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
