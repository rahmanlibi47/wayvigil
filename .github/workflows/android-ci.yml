name: Android CI

on:
  push:
    branches: [main, develop]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android checks and build
        run: >-
          ./gradlew --max-workers=4 --build-cache ktlintCheck testDebugUnitTest
          compileReleaseKotlin assembleDebug
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || '' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
